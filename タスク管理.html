<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f8f6;
    --surface: #ffffff;
    --border: #e5e5e0;
    --text: #1a1a1a;
    --muted: #888880;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --high: #ef4444;
    --med: #f59e0b;
    --low: #22c55e;
    --done-bg: #f4f4f2;
    --done-text: #aaa;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,.06);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .tab-group { display: flex; gap: 4px; }
  .tab {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted);
    font-weight: 500;
    transition: .15s;
  }
  .tab.active { background: var(--accent-light); color: var(--accent); }

  /* ===== LAYOUT ===== */
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ===== ADD FORM ===== */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .add-row:last-child { margin-bottom: 0; }
  .add-row input, .add-row select {
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0 10px;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border .15s;
  }
  .add-row input:focus, .add-row select:focus { border-color: var(--accent); }
  .input-title { flex: 1; min-width: 180px; }
  .input-tag { width: 120px; }
  .input-date { width: 140px; }
  .add-row select { width: 110px; }
  .btn-add {
    height: 36px;
    padding: 0 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .btn-add:hover { opacity: .85; }

  /* ===== FILTERS ===== */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-chip {
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    background: var(--surface);
    color: var(--muted);
    transition: .15s;
    white-space: nowrap;
  }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-sep { flex: 1; }
  .sort-select {
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0 8px;
    font-size: 12px;
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  /* ===== TASK LIST ===== */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    transition: opacity .2s;
  }
  .task-item.done { background: var(--done-bg); }
  .task-item.done .task-title { text-decoration: line-through; color: var(--done-text); }
  .task-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: .15s;
    background: var(--surface);
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after { content: '✓'; color: #fff; font-size: 11px; }
  .priority-bar {
    width: 3px;
    border-radius: 2px;
    align-self: stretch;
    flex-shrink: 0;
  }
  .p-high  { background: var(--high); }
  .p-med   { background: var(--med); }
  .p-low   { background: var(--low); }
  .p-none  { background: var(--border); }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .tag-chip {
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
  }
  .due-label { font-size: 11px; color: var(--muted); }
  .due-label.overdue { color: var(--high); font-weight: 600; }
  .due-label.today { color: var(--med); font-weight: 600; }
  .task-del {
    background: none; border: none;
    color: var(--border);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: .15s;
  }
  .task-del:hover { color: var(--high); background: #fef2f2; }
  .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }

  /* ===== STATS BAR ===== */
  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat { font-size: 12px; color: var(--muted); }
  .stat strong { color: var(--text); }

  /* ===== CALENDAR ===== */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-header h2 { font-size: 16px; font-weight: 600; }
  .cal-nav {
    background: none; border: 1px solid var(--border);
    border-radius: 7px; width: 32px; height: 32px;
    cursor: pointer; font-size: 16px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: .15s;
  }
  .cal-nav:hover { background: var(--bg); color: var(--text); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day-name {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 6px 0;
    font-weight: 600;
  }
  .cal-cell {
    min-height: 72px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    transition: .15s;
  }
  .cal-cell:hover { border-color: var(--accent); }
  .cal-cell.other-month { background: var(--bg); opacity: .5; }
  .cal-cell.today-cell { border-color: var(--accent); }
  .cal-num {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .cal-cell.today-cell .cal-num {
    background: var(--accent);
    color: #fff;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-task-dot {
    font-size: 10px;
    line-height: 1.6;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-task-dot::before {
    content: '●';
    font-size: 7px;
    margin-right: 3px;
    color: var(--accent);
  }
  .cal-task-dot.p-high::before { color: var(--high); }
  .cal-task-dot.p-med::before  { color: var(--med); }
  .cal-task-dot.p-low::before  { color: var(--low); }
  .cal-more { font-size: 10px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>📋 タスク管理</h1>
  <div class="tab-group">
    <button class="tab active" onclick="showView('list')">リスト</button>
    <button class="tab" onclick="showView('calendar')">カレンダー</button>
  </div>
</header>

<!-- ===== LIST VIEW ===== -->
<div class="container">
  <div id="view-list" class="view active">

    <!-- Add Form -->
    <div class="add-card">
      <div class="add-row">
        <input class="input-title" id="inp-title" type="text" placeholder="タスクを入力…" onkeydown="if(event.key==='Enter')addTask()">
        <input class="input-tag" id="inp-tag" type="text" placeholder="カテゴリ">
        <button class="btn-add" onclick="addTask()">＋ 追加</button>
      </div>
      <div class="add-row">
        <input class="input-date" id="inp-date" type="date">
        <select id="inp-priority">
          <option value="">優先度なし</option>
          <option value="high">🔴 高</option>
          <option value="med">🟡 中</option>
          <option value="low">🟢 低</option>
        </select>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Filters -->
    <div class="filters" id="filters">
      <span class="filter-chip active" onclick="setFilter('all',this)">すべて</span>
      <span class="filter-chip" onclick="setFilter('active',this)">未完了</span>
      <span class="filter-chip" onclick="setFilter('done',this)">完了</span>
      <span class="filter-chip" onclick="setFilter('overdue',this)">期限切れ</span>
      <span class="filter-chip" onclick="setFilter('today',this)">今日</span>
      <span class="filter-sep"></span>
      <select class="sort-select" onchange="currentSort=this.value;renderList()">
        <option value="created">追加順</option>
        <option value="due">期限順</option>
        <option value="priority">優先度順</option>
      </select>
    </div>

    <!-- Tag filters (dynamic) -->
    <div id="tag-filters" class="filters" style="margin-top:-8px;margin-bottom:16px;"></div>

    <!-- Task List -->
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- ===== CALENDAR VIEW ===== -->
  <div id="view-calendar" class="view">
    <div class="add-card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input class="input-title" id="cal-inp-title" type="text" placeholder="タスクを入力…" onkeydown="if(event.key==='Enter')calAdd()">
      <input class="input-date" id="cal-inp-date" type="date">
      <select id="cal-inp-priority">
        <option value="">優先度なし</option>
        <option value="high">🔴 高</option>
        <option value="med">🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
      <input class="input-tag" id="cal-inp-tag" type="text" placeholder="カテゴリ">
      <button class="btn-add" onclick="calAdd()">＋ 追加</button>
    </div>
    <div class="cal-header">
      <button class="cal-nav" onclick="calMove(-1)">‹</button>
      <h2 id="cal-title"></h2>
      <button class="cal-nav" onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<script>
// ===== STATE =====
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let currentFilter = 'all';
let currentTagFilter = '';
let currentSort = 'created';
let calYear, calMonth;

const today = new Date();
today.setHours(0,0,0,0);
const todayStr = fmt(today);

function fmt(d) {
  return d.toISOString().split('T')[0];
}

function save() {
  localStorage.setItem('tasks', JSON.stringify(tasks));
}

// ===== ADD =====
function addTask() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) return;
  tasks.unshift({
    id: Date.now(),
    title,
    tag: document.getElementById('inp-tag').value.trim(),
    date: document.getElementById('inp-date').value,
    priority: document.getElementById('inp-priority').value,
    done: false,
    created: Date.now()
  });
  save();
  document.getElementById('inp-title').value = '';
  renderAll();
}

function calAdd() {
  const title = document.getElementById('cal-inp-title').value.trim();
  if (!title) return;
  tasks.unshift({
    id: Date.now(),
    title,
    tag: document.getElementById('cal-inp-tag').value.trim(),
    date: document.getElementById('cal-inp-date').value,
    priority: document.getElementById('cal-inp-priority').value,
    done: false,
    created: Date.now()
  });
  save();
  document.getElementById('cal-inp-title').value = '';
  renderAll();
}

// ===== TOGGLE / DELETE =====
function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); renderAll(); }
}
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save();
  renderAll();
}

// ===== FILTERS =====
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('#filters .filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}
function setTagFilter(tag, el) {
  currentTagFilter = currentTagFilter === tag ? '' : tag;
  document.querySelectorAll('#tag-filters .filter-chip').forEach(c => c.classList.remove('active'));
  if (currentTagFilter) el.classList.add('active');
  renderList();
}

function getFiltered() {
  let list = [...tasks];
  if (currentFilter === 'active')  list = list.filter(t => !t.done);
  if (currentFilter === 'done')    list = list.filter(t => t.done);
  if (currentFilter === 'overdue') list = list.filter(t => !t.done && t.date && t.date < todayStr);
  if (currentFilter === 'today')   list = list.filter(t => t.date === todayStr);
  if (currentTagFilter)            list = list.filter(t => t.tag === currentTagFilter);

  const pOrder = { high:0, med:1, low:2, '':3 };
  if (currentSort === 'due') {
    list.sort((a,b) => (a.date||'9999') < (b.date||'9999') ? -1 : 1);
  } else if (currentSort === 'priority') {
    list.sort((a,b) => pOrder[a.priority] - pOrder[b.priority]);
  }
  return list;
}

// ===== RENDER LIST =====
function renderList() {
  renderStats();
  renderTagFilters();
  const list = getFiltered();
  const el = document.getElementById('task-list');
  if (!list.length) { el.innerHTML = '<div class="empty">タスクがありません</div>'; return; }

  el.innerHTML = list.map(t => {
    const done = t.done;
    let dueLabel = '';
    if (t.date) {
      if      (t.date < todayStr) dueLabel = `<span class="due-label overdue">期限切れ: ${t.date}</span>`;
      else if (t.date === todayStr) dueLabel = `<span class="due-label today">今日: ${t.date}</span>`;
      else dueLabel = `<span class="due-label">${t.date}</span>`;
    }
    const pClass = t.priority ? 'p-' + t.priority : 'p-none';
    const tag = t.tag ? `<span class="tag-chip">${esc(t.tag)}</span>` : '';
    return `
      <div class="task-item${done?' done':''}">
        <div class="task-check${done?' checked':''}" onclick="toggleDone(${t.id})"></div>
        <div class="priority-bar ${pClass}"></div>
        <div class="task-body">
          <div class="task-title">${esc(t.title)}</div>
          <div class="task-meta">${tag}${dueLabel}</div>
        </div>
        <button class="task-del" onclick="deleteTask(${t.id})" title="削除">×</button>
      </div>`;
  }).join('');
}

function renderStats() {
  const total  = tasks.length;
  const done   = tasks.filter(t => t.done).length;
  const active = total - done;
  const over   = tasks.filter(t => !t.done && t.date && t.date < todayStr).length;
  document.getElementById('stats').innerHTML = `
    <span class="stat">合計 <strong>${total}</strong></span>
    <span class="stat">未完了 <strong>${active}</strong></span>
    <span class="stat">完了 <strong>${done}</strong></span>
    ${over ? `<span class="stat" style="color:var(--high)">期限切れ <strong>${over}</strong></span>` : ''}
  `;
}

function renderTagFilters() {
  const tags = [...new Set(tasks.map(t=>t.tag).filter(Boolean))];
  const el = document.getElementById('tag-filters');
  el.innerHTML = tags.map(tag =>
    `<span class="filter-chip${currentTagFilter===tag?' active':''}" onclick="setTagFilter('${esc(tag)}',this)">${esc(tag)}</span>`
  ).join('');
}

// ===== RENDER CALENDAR =====
function renderCalendar() {
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay  = new Date(calYear, calMonth+1, 0);
  document.getElementById('cal-title').textContent =
    `${calYear}年${calMonth+1}月`;

  const grid = document.getElementById('cal-grid');
  const dayNames = ['日','月','火','水','木','金','土'];
  let html = dayNames.map(d => `<div class="cal-day-name">${d}</div>`).join('');

  const startWday = firstDay.getDay();
  for (let i = 0; i < startWday; i++) {
    const d = new Date(calYear, calMonth, -startWday+i+1);
    html += calCell(d, true);
  }
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(calYear, calMonth, d);
    html += calCell(date, false);
  }
  const endWday = lastDay.getDay();
  for (let i = 1; i < 7 - endWday; i++) {
    const d = new Date(calYear, calMonth+1, i);
    html += calCell(d, true);
  }
  grid.innerHTML = html;
}

function calCell(date, otherMonth) {
  const ds = fmt(date);
  const isToday = ds === todayStr;
  const dayTasks = tasks.filter(t => t.date === ds && !t.done);
  const maxShow = 2;
  const shown = dayTasks.slice(0, maxShow);
  const more  = dayTasks.length - maxShow;
  const pClass = t => t.priority ? 'p-'+t.priority : '';
  const dots = shown.map(t =>
    `<div class="cal-task-dot ${pClass(t)}">${esc(t.title)}</div>`).join('');
  const moreEl = more > 0 ? `<div class="cal-more">+${more}件</div>` : '';
  return `
    <div class="cal-cell${otherMonth?' other-month':''}${isToday?' today-cell':''}"
         onclick="calClickDay('${ds}')">
      <div class="cal-num">${date.getDate()}</div>
      ${dots}${moreEl}
    </div>`;
}

function calClickDay(ds) {
  document.getElementById('cal-inp-date').value = ds;
  document.getElementById('cal-inp-title').focus();
}

function calMove(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

// ===== VIEW SWITCH =====
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'calendar') renderCalendar();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderAll() { renderList(); if (!document.getElementById('view-calendar').classList.contains('active')) return; renderCalendar(); }

// ===== INIT =====
calYear  = today.getFullYear();
calMonth = today.getMonth();
document.getElementById('inp-date').value = todayStr;
document.getElementById('cal-inp-date').value = todayStr;
renderAll();
</script>
</body>
</html>
