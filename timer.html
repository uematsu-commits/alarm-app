<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { font-size: 1.2rem; letter-spacing: 0.2em; margin-bottom: 2rem; color: #aaa; }
    .display {
      font-size: 5rem;
      font-variant-numeric: tabular-nums;
      font-weight: 200;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }
    .display.alert { color: #e74c3c; }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      align-items: center;
    }
    .input-row input {
      width: 4rem;
      text-align: center;
      font-size: 1.4rem;
      padding: 0.3rem;
      border: none;
      border-bottom: 2px solid #555;
      background: transparent;
      color: #eee;
      outline: none;
    }
    .input-row input:focus { border-bottom-color: #7f8cff; }
    .input-row span { font-size: 1.4rem; color: #888; }
    .buttons { display: flex; gap: 1rem; }
    button {
      padding: 0.7rem 2rem;
      font-size: 1rem;
      border: 2px solid #555;
      border-radius: 50px;
      background: transparent;
      color: #eee;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #333; }
    #startBtn { border-color: #7f8cff; color: #7f8cff; }
    #startBtn:hover { background: #7f8cff22; }
    #resetBtn { border-color: #555; }
    .mode-toggle {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0;
      border: 1px solid #444;
      border-radius: 50px;
      overflow: hidden;
    }
    .mode-toggle button {
      border: none;
      border-radius: 0;
      padding: 0.4rem 1.4rem;
      font-size: 0.85rem;
    }
    .mode-toggle button.active { background: #7f8cff; color: #fff; }
  </style>
</head>
<body>
  <h1>TIMER</h1>
  <div class="mode-toggle">
    <button id="countdownBtn" class="active" onclick="setMode('countdown')">カウントダウン</button>
    <button id="stopwatchBtn" onclick="setMode('stopwatch')">ストップウォッチ</button>
  </div>
  <div class="display" id="display">00:00</div>
  <div class="input-row" id="inputRow">
    <input type="number" id="minInput" value="1" min="0" max="99" placeholder="00">
    <span>分</span>
    <input type="number" id="secInput" value="0" min="0" max="59" placeholder="00">
    <span>秒</span>
  </div>
  <div class="buttons">
    <button id="startBtn" onclick="toggle()">スタート</button>
    <button id="resetBtn" onclick="reset()">リセット</button>
  </div>

  <script>
    let mode = 'countdown';
    let running = false;
    let interval = null;
    let remaining = 0;
    let elapsed = 0;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const inputRow = document.getElementById('inputRow');

    function fmt(total) {
      const m = Math.floor(total / 60).toString().padStart(2, '0');
      const s = (total % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setMode(m) {
      mode = m;
      reset();
      document.getElementById('countdownBtn').classList.toggle('active', m === 'countdown');
      document.getElementById('stopwatchBtn').classList.toggle('active', m === 'stopwatch');
      inputRow.style.display = m === 'countdown' ? 'flex' : 'none';
    }

    function toggle() {
      if (running) {
        clearInterval(interval);
        running = false;
        startBtn.textContent = '再開';
      } else {
        if (mode === 'countdown') {
          if (remaining === 0) {
            const m = parseInt(document.getElementById('minInput').value) || 0;
            const s = parseInt(document.getElementById('secInput').value) || 0;
            remaining = m * 60 + s;
            if (remaining === 0) return;
          }
          interval = setInterval(() => {
            remaining--;
            display.textContent = fmt(remaining);
            if (remaining <= 0) {
              clearInterval(interval);
              running = false;
              startBtn.textContent = 'スタート';
              display.classList.add('alert');
              beep();
            }
          }, 1000);
        } else {
          interval = setInterval(() => {
            elapsed++;
            display.textContent = fmt(elapsed);
          }, 1000);
        }
        running = true;
        startBtn.textContent = '一時停止';
        display.classList.remove('alert');
      }
    }

    function reset() {
      clearInterval(interval);
      running = false;
      remaining = 0;
      elapsed = 0;
      display.textContent = '00:00';
      display.classList.remove('alert');
      startBtn.textContent = 'スタート';
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.3, 0.6].forEach(t => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.3, ctx.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
          o.start(ctx.currentTime + t);
          o.stop(ctx.currentTime + t + 0.25);
        });
      } catch {}
    }
  </script>
</body>
</html>
