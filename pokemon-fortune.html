<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン生年月日占い</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0015;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.10);
      --gold: #f5c842;
      --gold2: #c9922a;
      --text: #f0e8ff;
      --muted: #9980bb;
      --star: #e0d0ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    body {
      font-family: 'Noto Serif JP', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 星空背景 */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* メインコンテナ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header .crest {
      font-size: 2.8rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 16px rgba(245,200,66,0.6));
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #f5c842, #e0a020, #f5c842);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 6px;
    }

    .header .tagline {
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 2px;
    }

    /* 区切り線 */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--gold2);
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold2), transparent);
    }

    /* 入力カード */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 20px;
      backdrop-filter: blur(12px);
    }

      font-size: 0.78rem;
      letter-spacing: 2px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }

      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
    }

    .date-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 1px;
    }

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 9px 6px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
    }

    .date-group select:focus {
      border-color: var(--gold);
    }

    .date-sep {
      font-size: 1.2rem;
      color: var(--gold2);
      margin-top: 18px;
    }

      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: linear-gradient(135deg, #c9922a, #f5c842, #c9922a);
      background-size: 200% 100%;
      border: none;
      border-radius: 999px;
      color: #1a0d00;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background-position 0.4s, transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(200,146,42,0.4);
    }

      background-position: 100% 0;
      box-shadow: 0 6px 28px rgba(200,146,42,0.6);
    }

    .btn-fortune:disabled { opacity: 0.5; cursor: wait; }

      display: none;
      text-align: center;
      padding: 48px 0;

    .orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c9d6ff, #3a1a6e);

      box-shadow: 0 0 30px rgba(150,100,255,0.6), inset 0 0 20px rgba(255,255,255,0.1);
      animation: pulse 1.4s ease-in-out infinite;

      padding: 32px 24px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 240px; height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--type-color, rgba(150,100,255,0.2)) 0%, transparent 70%);

      top: 16px; right: 20px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

      height: 180px;

    .poke-name {

      font-weight: 900;
      letter-spacing: 2px;

      gap: 10px;
      margin-top: 12px;

    .fortune-item {

      padding: 16px 14px;
      text-align: center;

<script>
/* ===== 星空 ===== */
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let W, H, stars;

  function init() {
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
    stars = Array.from({length: 200}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4+0.2,
      a: Math.random(),
      da: (Math.random()-0.5)*0.004
    }));
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    stars.forEach(s => {
      s.a = Math.max(0.1, Math.min(1, s.a + s.da));
      if (s.a <= 0.1 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(224,208,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.addEventListener('resize', init);
})();

/* ===== セレクト初期化 ===== */
(function(){
  const y = document.getElementById('selYear');
  const m = document.getElementById('selMonth');
  const d = document.getElementById('selDay');
  const now = new Date();
  for (let i = now.getFullYear(); i >= 1924; i--) {
    const o = new Option(i+'年', i);
    if (i === 1990) o.selected = true;
    y.add(o);
  }
  for (let i = 1; i <= 12; i++) m.add(new Option(i+'月', i));
  m.value = 1;
  updateDays();

  function updateDays() {
    const yv = +y.value, mv = +m.value;
    const max = new Date(yv, mv, 0).getDate();
    const cur = +d.value || 1;
    d.innerHTML = '';
    for (let i = 1; i <= max; i++) d.add(new Option(i+'日', i));
    d.value = Math.min(cur, max);
  }

  y.addEventListener('change', updateDays);
  m.addEventListener('change', updateDays);
})();

/* ===== ポケモン選択ロジック =====
   生年月日から守護ポケモンIDを決定する。
   同じ生年月日は常に同じポケモンを返す（決定論的）。
   LCGベースの軽量ハッシュを使用。
*/
function dateToPokeId(year, month, day) {
  let seed = year * 13 + month * 31 + day * 7;
  // LCG: linear congruential generator
  seed = (seed ^ (seed >> 4)) * 0x45d9f3b;
  seed = (seed ^ (seed >> 15)) >>> 0;
  return (seed % 898) + 1; // ポケモンNo.1〜898
}

function statToStars(value, max=255) {
  const ratio = value / max;
  const stars = Math.round(ratio * 4) + 1; // 1〜5
  return '★'.repeat(Math.min(stars,5)) + '☆'.repeat(Math.max(0, 5-Math.min(stars,5)));
}

function pickMsg(arr, seed) {
  const pool = arr.flat();
  return pool[seed % pool.length];
}

/* ===== 日本語名キャッシュ ===== */
const jaNameCache = {};
async function fetchJaName(id) {
  if (jaNameCache[id]) return jaNameCache[id];
  try {
    const r = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
    if (!r.ok) return null;
    const d = await r.json();
    const entry = d.names.find(n=>n.language.name==='ja-Hrkt') || d.names.find(n=>n.language.name==='ja');
    jaNameCache[id] = entry?.name || null;
    return jaNameCache[id];
  } catch { return null; }
}

/* ===== 占いメイン ===== */
async function startFortune() {
  const year  = +document.getElementById('selYear').value;
  const month = +document.getElementById('selMonth').value;
  const day   = +document.getElementById('selDay').value;

  document.getElementById('btnFortune').disabled = true;
  document.querySelector('.input-card').style.opacity = '0.4';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';

  const pokeId = dateToPokeId(year, month, day);

  try {
    const [res, jaName] = await Promise.all([
      fetch(`https://pokeapi.co/api/v2/pokemon/${pokeId}`),
      fetchJaName(pokeId),
    ]);
    if (!res.ok) throw new Error();
    const p = await res.json();

    const primaryType = p.types[0].type.name;
    const typeColor = TYPE_COLORS[primaryType] || '#9980bb';
    const destinyInfo = TYPE_DESTINY[primaryType] || TYPE_DESTINY.normal;
    const displayName = jaName || p.name;

    const statsMap = {};
    p.stats.forEach(s => { statsMap[s.stat.name] = s.base_stat; });
    const seed = year + month * 100 + day * 10000;

    // ラッキーナンバー（ポケモンIDから）
    const luckyNum = ((pokeId * 7 + month * 3 + day) % 9) + 1;

    // 総合運（BST合計を600基準に換算）
    const bst = Object.values(statsMap).reduce((a,b)=>a+b,0);
    const overallStars = Math.min(5, Math.max(1, Math.round(bst / 600 * 5)));
    const overallStr = '★'.repeat(overallStars) + '☆'.repeat(5-overallStars);

    // カードに型カラー注入
    const card = document.getElementById('pokeCard');
    card.style.setProperty('--type-color', typeColor + '55');

    // ポケモン画像
    const imgUrl = p.sprites?.other?.['official-artwork']?.front_default || p.sprites?.front_default || '';
    const img = document.getElementById('pokeImg');
    img.src = imgUrl;
    img.alt = displayName;
    img.style.filter = `drop-shadow(0 4px 24px ${typeColor}88)`;
    img.onload = () => img.classList.add('show');

    document.getElementById('pokeNum').textContent = `No.${String(p.id).padStart(3,'0')}`;
    document.getElementById('pokeName').textContent = displayName;
    document.getElementById('pokeTypes').innerHTML =
      p.types.map(t=>`<span class="type-badge type-${t.type.name}">${typeJa(t.type.name)}</span>`).join('');
    document.getElementById('destinyMsg').innerHTML =
      `<strong>【${destinyInfo.element}の守護】</strong><br>${destinyInfo.personality}`;

    // 運勢グリッド
    const grid = document.getElementById('fortuneGrid');
    grid.innerHTML = `
      <div class="fortune-item wide">
        <div class="fortune-label">✦ 総 合 運 ✦</div>
        <div class="fortune-stars" style="color:var(--gold)">${overallStr}</div>
        <div class="fortune-text">あなたの守護ポケモンの基礎ステータス合計は${bst}。${bst>=500?'強大な力があなたを守っています。':'大いなる成長の可能性を秘めています。'}</div>
      </div>
      <div class="fortune-item">
        <div class="fortune-label">💕 恋 愛 運</div>
        <div class="fortune-stars">${statToStars(statsMap['special-attack']||50)}</div>
        <div class="fortune-text">${pickMsg(FORTUNE_MSGS.love, seed+1)}</div>
      </div>
      <div class="fortune-item">
        <div class="fortune-label">💼 仕 事 運</div>
        <div class="fortune-stars">${statToStars(statsMap['attack']||50)}</div>
        <div class="fortune-text">${pickMsg(FORTUNE_MSGS.work, seed+2)}</div>
      </div>
      <div class="fortune-item">
        <div class="fortune-label">💰 金 運</div>
        <div class="fortune-stars">${statToStars(statsMap['speed']||50)}</div>
        <div class="fortune-text">${pickMsg(FORTUNE_MSGS.money, seed+3)}</div>
      </div>
      <div class="fortune-item">
        <div class="fortune-label">🌿 健 康 運</div>
        <div class="fortune-stars">${statToStars(statsMap['hp']||50)}</div>
        <div class="fortune-text">${pickMsg(FORTUNE_MSGS.health, seed+4)}</div>
      </div>
      <div class="fortune-item wide">
        <div class="fortune-label">✨ ラ ッ キ ー</div>
        <div class="lucky-row">
          <span class="lucky-chip">ラッキーナンバー ${luckyNum}</span>
          <span class="lucky-chip">ラッキーカラー ${destinyInfo.lucky_color}</span>
          <span class="lucky-chip">属性 ${destinyInfo.element}</span>
        </div>
      </div>
    `;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';

  } catch {
    document.getElementById('loading').style.display = 'none';
    alert('データの取得に失敗しました。もう一度お試しください。');
    document.getElementById('btnFortune').disabled = false;
    document.querySelector('.input-card').style.opacity = '1';
  }
}

function resetForm() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('btnFortune').disabled = false;
  document.querySelector('.input-card').style.opacity = '1';
  document.getElementById('pokeImg').classList.remove('show');
}

function typeJa(t) {
  const map = {
    normal:'ノーマル',fire:'ほのお',water:'みず',grass:'くさ',electric:'でんき',
    ice:'こおり',fighting:'かくとう',poison:'どく',ground:'じめん',flying:'ひこう',
    psychic:'エスパー',bug:'むし',rock:'いわ',ghost:'ゴースト',dragon:'ドラゴン',
    dark:'あく',steel:'はがね',fairy:'フェアリー'
  };
  return map[t] || t;
}
</script>
</body>
</html>
